<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
  <title>dokke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: rgba(255,255,255,.94);
    --ink-2: rgba(255,255,255,.62);
    --ink-3: rgba(255,255,255,.5);
    --accent: #0a84ff;
    --green: #30d158;
    --amber: #ffd60a;
    --red: #ff453a;
    --glass: rgba(255,255,255,.07);
    --edge: rgba(255,255,255,.10);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  :focus{ outline: none; }
  html,body{ height:100%; height: 100dvh; min-height: -webkit-fill-available; }
  body{
    font-family: "Inter", -apple-system, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    background: none;
    color: var(--ink);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    position: fixed; top:0; left:0; right:0; bottom:0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bg{
    position: fixed; top:0; left:0; right:0; bottom:0; z-index:-2;
    background:
      radial-gradient(130% 65% at 50% -10%, rgba(210, 95, 30, 0.40), transparent 60%),
      radial-gradient(90% 55% at 85% 45%, rgba(160, 65, 15, 0.24), transparent 55%),
      linear-gradient(180deg, #1c0d05 0%, #120702 55%, #080301 100%);
  }

  main{
    position: absolute; top:0; left:0; right:0; bottom:0;
    padding: 0;
  }
  /* Duas camadas independentes: cada tela ocupa a viewport inteira.
     A WebView da J5 NÃO resolve height:100% em flex no fluxo — por isso
     cada .screen é absolute e o container não empilha. Transição por
     translate+opacity (slide + class toggle) para eliminar conflitos. */
  .screens{
    position: absolute; top:0; left:0; right:0; bottom:0;
    padding: 0 14px;
    overflow: hidden;
    touch-action: none;
  }
  .screen{
    position: absolute; top:0; left:0; right:0; bottom:0;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
  }
  /* apps visível por padrão; recents escondido */
  #screenApps{ opacity: 1; pointer-events: auto; z-index: 1; }
  #screenRecents{ opacity: 0; pointer-events: none; z-index: 0; }
  /* body.is-recents inverte */
  body.is-recents #screenApps{ opacity: 0; pointer-events: none; z-index: 0; }
  body.is-recents #screenRecents{ opacity: 1; pointer-events: auto; z-index: 1; }

  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(48,209,88,.55); }
    70%{ box-shadow: 0 0 0 9px rgba(48,209,88,0); }
    100%{ box-shadow: 0 0 0 0 rgba(48,209,88,0); }
  }

  /* ---- stage (launchpad full-bleed; chrome lateral removido) ---- */
  .stage{
    flex: 1 1 auto; min-height: 0; margin-top: 10px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .launchpadwrap{
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .launchpad{
    flex: 1 1 auto; min-height: 0;
    display: flex;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    touch-action: pan-x;
    overscroll-behavior-x: contain;
  }
  .launchpad::-webkit-scrollbar{ display: none; }
  .page{
    flex: 0 0 100%;
    scroll-snap-align: start;
    display: grid;
    grid-template-columns: repeat(2, var(--tile));
    grid-template-rows: repeat(4, var(--tile));
    grid-gap: 8px;
    justify-content: center;
    align-content: center;
    padding: 10px 24px;
    box-sizing: border-box;
    /* tile orientação-independente (vmin = dimensão menor): rotação não relayouta nada */
    --tile: 38vmin;
    --tile-r: 0.28;
    --tile-in: 0.92;
    --tile-in-r: 0.19;
  }
  @supports (width: min(1px, 2px)){
    .page{
      grid-gap: min(2.5vmin, 12px);
      padding: clamp(8px, 2vw, 24px) clamp(12px, 3vw, 32px);
      --tile: min(38vmin, 180px);
    }
  }
  /* WebView antigo (ex.: Android 6 sem grid): fallback flex 2x4 */
  @supports not (display: grid){
    .page{
      display: flex; flex-wrap: wrap;
      align-content: center; justify-content: space-around;
    }
    .page .atile{ flex: 0 0 38vmin; }
  }
  .atile{
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 20px;
    user-select: none; -webkit-user-select: none;
    min-height: 0;
    width: var(--tile); height: var(--tile);
    container-type: inline-size;
  }
  .atile:active{ background: rgba(255,255,255,.05); }
  /* glass base (tela 2 .fav sobrescreve com tamanhos próprios) */
  .aglass{
    position: relative;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, rgba(255,255,255,.24), rgba(210,95,30,.18) 55%, rgba(35,16,8,.75));
    border: 1.5px solid rgba(240, 135, 55, 0.40);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.35), 0 0 18px rgba(210,95,30,.22), 0 8px 18px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .aglass::before{
    content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(160deg, rgba(255,255,255,.28), transparent 45%);
    pointer-events: none;
  }
  .aglass .gicon, .aglass img.aicon{
    object-fit: cover;
    position: relative; z-index: 1;
  }
  .aglass .gicon{
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  /* launchpad: tamanho fluido — aglass e ícone preenchem o tile */
  .atile .aglass{
    width: 100%; height: 100%;
    border-radius: 26%;
  }
  .atile .aglass::before{ border-radius: 26%; }
  .atile .aglass .gicon, .atile .aglass img.aicon{
    width: 92%; height: 92%;
    border-radius: 18%;
  }
  .atile .aglass .gicon{ font-size: 30px; }
  @supports (width: 1cqi){
    .atile .aglass{ border-radius: calc(100cqi * var(--tile-r)); }
    .atile .aglass::before{ border-radius: calc(100cqi * var(--tile-r)); }
    .atile .aglass .gicon, .atile .aglass img.aicon{
      width: calc(100cqi * var(--tile-in)); height: calc(100cqi * var(--tile-in));
      border-radius: calc(100cqi * var(--tile-in-r));
    }
    .atile .aglass .gicon{ font-size: 30cqi; }
  }
  .atile .aname{
    display: none;
  }
  .atile .astatus{
    display: none;
  }
  .atile .astatus.on{ color: var(--accent); }

  /* ---- dots paginação = mesmo visual dos vdots (eixo horizontal) ---- */
  .dots{
    flex: 0 0 auto; display: flex; justify-content: center; align-items: center;
    padding: 22px 0 calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .dots .d{
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.35);
    border: none;
    margin: 0 5px;
    transition: all .2s ease;
  }
  .dots .d.on{
    background: #fff;
    width: 14px; height: 6px;
    border-radius: 3px;
  }

  /* ---- vdots (lateral, troca de tela) ---- */
  .vdots{
    position: fixed; right: 6px; top: 50%; transform: translateY(-50%); z-index: 30;
    display: flex; flex-direction: column; align-items: center;
  }
  .vdots .d{
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,.35); margin: 5px 0;
    border: none;
    transition: all .2s ease;
  }
  .vdots .d.on{ background: #fff; height: 14px; width: 6px; border-radius: 3px; }

  /* ---- tela 2 v02: title top, hint bottom, apps centered ---- */
  .recents{
    flex: 1 1 auto; min-height: 0; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: env(safe-area-inset-top, 0px) 0 calc(env(safe-area-inset-bottom, 0px) + 8px);
    box-sizing: border-box;
  }
  .thead{
    flex: 0 0 auto;
    width: 100%;
    display: flex; flex-direction: row; align-items: baseline;
    justify-content: center;
    padding: 16px 20px 0;
    box-sizing: border-box;
  }
  .ttitle{
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 26px; font-weight: 700;
    color: rgba(255,255,255,.92);
    letter-spacing: -0.02em;
    pointer-events: none;
    text-align: center;
    width: 100%;
  }
  .rstage{
    flex: 1 1 auto; min-height: 0;
    width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .favscroll{
    width: 100%;
    overflow-x: auto; overflow-y: visible;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    padding: 20px 0;
    box-sizing: border-box;
  }
  .favscroll::-webkit-scrollbar{ display: none; }
  .favrow{
    display: flex; flex-direction: row; align-items: center;
    width: -webkit-max-content; width: max-content;
    margin: 0 auto;
    padding: 0 24px;
    box-sizing: border-box;
  }
  /* ---- tile fav: responsivo via container queries ---- */
  :root{
    --fav-tile: 140px;
  }
  @supports (width: min(1px, 2px)){
    :root{
      --fav-tile: clamp(140px, min(28vmin, 34vw), 320px);
    }
  }
  .fav{
    position: relative; flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    width: var(--fav-tile); height: var(--fav-tile);
    margin: 0 calc(var(--fav-tile) * -0.12);
    opacity: 0.82;
    z-index: 1;
    transition: transform .15s ease, opacity .15s ease;
    container-type: inline-size;
  }
  .fav .aglass{
    width: 94%; height: 94%; border-radius: 26%;
    background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(210,95,30,.12) 55%, rgba(35,16,8,.65));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid rgba(240, 135, 55, 0.40);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.35), 0 0 18px rgba(210,95,30,.22), 0 8px 18px rgba(0,0,0,.45);
    transition: border-color .2s ease, box-shadow .2s ease;
    overflow: hidden;
  }
  .fav .aglass .gicon, .fav .aglass img.aicon{
    width: 84%; height: 84%; border-radius: 20%;
  }
  .fav .aglass .gicon{ font-size: 30px; }
  @supports (width: 1cqi){
    .fav .aglass{
      width: 94cqi; height: 94cqi; border-radius: 24cqi;
    }
    .fav .aglass .gicon, .fav .aglass img.aicon{
      width: 82cqi; height: 82cqi; border-radius: 20cqi;
    }
    .fav .aglass .gicon{ font-size: 32cqi; }
  }
  .fav .fname{ display: none; }
  .fav .rdot{ display: none; }
  .thint{
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: "Bricolage Grotesque", sans-serif;
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,.38);
    padding: 0 16px;
    line-height: 1.35;
    letter-spacing: 0.02em;
    width: 100%;
  }
  .thint .pic{
    display: flex;
    align-items: center;
    flex: 0 0 auto;
    opacity: 0.75;
  }
  .thint .pic svg{
    display: block; width: 18px; height: 18px;
  }
  .rempty{
    color: var(--ink-3); font-size: 13px; text-align: center;
    padding: 24px 28px; max-width: 280px; line-height: 1.4;
  }
  .robscard{
    flex: 0 0 auto; display: flex; align-items: center;
    width: calc(100% - 40px); max-width: 360px;
    margin: 18px 20px 0; padding: 12px 14px; border-radius: 18px;
    background: linear-gradient(160deg, rgba(10,132,255,.22), rgba(94,92,230,.16));
    border: 1px solid rgba(10,132,255,.35);
    box-sizing: border-box;
  }
  .robscard .ic{ font-size: 20px; margin-right: 10px; }
  .robscard .ot{ flex: 1 1 auto; font-size: 14px; font-weight: 700; }
  .robscard .os{ font-size: 11px; font-weight: 600; color: var(--ink-2); }
  .robscard .arr{ font-size: 16px; color: var(--ink-2); }

  /* ---- landscape: grid 4x2, dock escala (GPU) ---- */
  @media (orientation: landscape){
    main{ padding: calc(env(safe-area-inset-top, 0px) + 6px) 0 0; }
    .page{
      grid-template-columns: repeat(4, var(--tile));
      grid-template-rows: repeat(2, var(--tile));
    }
    .launchpad{
      transform-origin: 50% 50%;
      transition: transform .25s ease;
    }
    .dots{
      padding: 18px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    }
  }

  /* ---- drawer (OBS) ---- */
  .drawer{
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 55;
    width: 92vw; max-width: 460px;
    background: rgba(16,17,26,.96);
    border-left: 1px solid rgba(255,255,255,.12);
    transform: translateX(102%);
    transition: transform .22s ease;
    display: flex; flex-direction: column;
    padding: 18px 16px 20px;
  }
  .drawer.show{ transform: none; }
  .drawer-head{
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex: 0 0 auto;
  }
  .drawer-head h2{ font-family: "Bricolage Grotesque", sans-serif; font-size: 17px; font-weight: 700; }
  .drawer-close{
    width: 40px; height: 40px; border-radius: 11px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.08); color: var(--ink-2); cursor: pointer; font-size: 16px;
  }
  .drawer-body{ flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .drawer-body::-webkit-scrollbar{ display: none; }

  .obstop{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .obstop .led{ display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink-2); }
  .obstop .led .d{ width:8px; height:8px; border-radius:50%; background: var(--ink-3); }
  .obstop .led.on .d{ background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.8s infinite; }
  .obstop .led.err .d{ background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .obstitle{ font-size: 14px; font-weight: 700; }
  .obsscene{ display:grid; grid-template-columns: repeat(3, 1fr); grid-gap:10px; }
  .scene{
    padding: 13px 8px; border-radius: 15px; cursor:pointer; text-align:center;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
    line-height:1.3; word-break:break-word;
    user-select:none; -webkit-user-select:none;
  }
  .scene:active{ background: rgba(255,255,255,.10); }
  .scene.active{
    color:#fff; background: linear-gradient(180deg, rgba(10,132,255,.55), rgba(94,92,230,.5));
    border-color: rgba(10,132,255,.85);
    box-shadow: 0 8px 18px rgba(10,132,255,.30), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .obsctl{ display:flex; margin-top:16px; }
  .ctl{
    flex:1; padding: 15px 6px 13px; border-radius: 17px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center;
    background: rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.09);
    font-size:12px; font-weight:600; color:var(--ink-2);
    user-select:none; -webkit-user-select:none;
  }
  .ctl + .ctl{ margin-left:10px; }
  .ctl:active{ background: rgba(255,255,255,.10); }
  .ctl .ic{ font-size:19px; line-height:1; color: rgba(255,255,255,.7); margin-bottom:6px; }
  .ctl.on-record, .ctl.on-stream{
    background: rgba(255,69,58,.16); border-color: rgba(255,69,58,.55); color:#fff;
  }
  .ctl.on-record .ic, .ctl.on-stream .ic{ color: var(--red); animation: blink 1s infinite; }
  @keyframes blink{ 0%,60%{opacity:1} 61%,100%{opacity:.35} }
  .ctl.stop{ color: var(--red); font-size: 13px; }
  .obsplaceholder{
    padding: 26px 18px; text-align:center; font-size:13px; color:var(--ink-2); font-style:italic;
  }
  .obsplaceholder .ic{ font-size:26px; display:block; margin-bottom:10px; opacity:.7; }

  /* ---- sheet / modal ---- */
  .scrim{
    position: fixed; top:0; left:0; right:0; bottom:0; z-index:50;
    display:none; align-items:flex-end; justify-content:center;
    padding: 0 14px 18px; background: rgba(2,4,10,.62);
  }
  .scrim.show{ display:flex; }
  .sheet{
    width:100%; max-width: 460px; border-radius: 30px; padding: 22px 18px 20px;
    background: rgba(24,26,38,.97);
    border: 1px solid rgba(255,255,255,.12);
    animation: rise .18s ease;
    max-height: 78vh; overflow-y: auto; scrollbar-width: none;
  }
  .sheet::-webkit-scrollbar{ display: none; }
  @keyframes rise{ from{ transform: translateY(14px); opacity:.4; } to{ transform:none; opacity:1; } }
  .sheet h3{ font-size:17px; font-weight:700; margin-bottom:6px; }
  .sheet .body{ font-size:13px; color:var(--ink-2); line-height:1.5; }
  .sheet .srow{
    display:flex; align-items:center; gap:12px; padding: 10px 6px;
    border-bottom:1px solid rgba(255,255,255,.06); cursor:pointer;
  }
  .sheet .srow:last-child{ border-bottom:none; }
  .sheet .srow:active{ background: rgba(255,255,255,.05); border-radius:14px; }
  .sheet .srow img{ width: 40px; height: 40px; border-radius: 12px; object-fit: cover; flex: 0 0 auto; }
  .sheet .srow .gicon{ width: 40px; height: 40px; border-radius: 12px; font-size: 14px; flex: 0 0 auto; }
  .sheet .srow .pin{ font-size: 11px; color: var(--green); font-weight: 700; margin-left: auto; flex: 0 0 auto; }
  .btns{ display:flex; margin-top: 20px; }
  .btn{
    flex:1; padding: 14px 10px; border-radius: 16px; cursor:pointer;
    font-size:15px; font-weight:700; color: var(--ink);
    background: rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.12);
  }
  .btn + .btn{ margin-left:10px; }
  .btn:active{ background: rgba(255,255,255,.15); }
  .btn.ghost{ background: rgba(255,255,255,.05); color: var(--ink-2); }
  .btn.danger{ background: rgba(255,69,58,.14); border-color: rgba(255,69,58,.45); color:#ff837d; }

  /* ---- toast ---- */
  .toast{
    position: fixed; left:50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
    transform: translateX(-50%) translateY(20px);
    z-index: 60; min-width: 200px; max-width: 320px; text-align:center;
    padding: 13px 20px; border-radius: 16px;
    background: rgba(28,34,54,.94); border:1px solid rgba(255,255,255,.14);
    box-shadow: 0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
    color: var(--ink); font-size: 13.5px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err{ border-color: rgba(255,69,58,.5); color:#ffb3ae; }
</style>
</head>
<body id="j5dock">
  <div class="bg"></div>

  <main>
  <div class="screens" id="screens">
    <section class="screen" id="screenApps">
      <div class="stage">
        <div class="launchpadwrap">
          <div class="launchpad" id="launchpad"></div>
          <div class="dots" id="dots"></div>
        </div>
      </div>
    </section>
    <section class="screen" id="screenRecents"></section>
  </div>
</main>

<div class="vdots" id="vdots"></div>

<div class="toast" id="toast"></div>

  <div class="scrim" id="scrim">
    <div class="sheet" id="sheet"></div>
  </div>

  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <h2>OBS Commander</h2>
      <button class="drawer-close" id="drawerClose" aria-label="Fechar">✕</button>
    </div>
    <div class="drawer-body" id="obspanel"></div>
  </aside>

<script>
(() => {
  "use strict";

  try {
    const S = p => { try { return CSS.supports(...p); } catch { return false; } };
    fetch("/api/probe?ua=" + encodeURIComponent(navigator.userAgent)
      + "&grid=" + S(["display", "grid"]) + "&gap=" + S(["gap", "1px"])
      + "&min=" + S(["width", "min(1px, 2px)"]) + "&clamp=" + S(["width", "clamp(1px, 2px, 3px)"])
      + "&cqi=" + S(["width", "1cqi"]) + "&dvh=" + S(["height", "100dvh"])
      + "&flex=" + S(["display", "flex"])
      + "&so=" + (screen.orientation ? screen.orientation.angle + ":" + screen.orientation.type : "none")
      + "&wo=" + (typeof window.orientation === "number" ? window.orientation : "none")
      + "&doe=" + (typeof DeviceOrientationEvent !== "undefined"), { mode: "no-cors" }).catch(() => {});
  } catch {}

  const $ = id => document.getElementById(id);

  const PALETTE = [
    ["#0a84ff","#5e5ce6"], ["#ff375f","#ff9f0a"], ["#30d158","#0a84ff"],
    ["#bf5af2","#ff375f"], ["#ff9f0a","#ff453a"], ["#64d2ff","#0a84ff"],
    ["#ffd60a","#ff9f0a"], ["#32d74b","#64d2ff"],
  ];
  function appGrad(name){
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    const [a, b] = PALETTE[h % PALETTE.length];
    return "linear-gradient(135deg, " + a + "cc, " + b + "b3)";
  }
  function mono(name){
    const w = name.trim().split(/\s+/);
    if (w.length > 1) return (w[0][0] + w[1][0]).toUpperCase();
    return name.trim().slice(0, 2).toUpperCase() || "?";
  }
  function giconEl(name){
    const s = document.createElement("span");
    s.className = "gicon";
    s.style.background = appGrad(name);
    s.textContent = mono(name);
    return s;
  }

  let toastT = null;
  function toast(msg, kind){
    kind = kind || "";
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toastT);
    toastT = setTimeout(function(){ t.classList.remove("show"); }, 2500);
  }

  // ---------- landscape detection ----------
  let landscape = false;
  function checkOrientation(){
    const m = window.matchMedia("(orientation: landscape)");
    const next = !!(m.matches || (window.innerWidth > window.innerHeight));
    if (next !== landscape){
      landscape = next;
      renderLaunchpad(true);
    }
    return next;
  }
  function pageSize(){ return 8; }

  async function req(path, opts){
    opts = opts || {};
    const timeout = opts.timeout || 2500;
    let c = null;
    if (typeof AbortController !== "undefined") c = new AbortController();
    const id = setTimeout(function(){ if (c) c.abort(); }, timeout);
    try {
      const init = { method: opts.method || "GET", headers: opts.headers, body: opts.body };
      if (c) init.signal = c.signal;
      const res = await fetch(path, init);
      const ct = res.headers.get("content-type") || "";
      const data = /application\/json/.test(ct) ? await res.json().catch(function(){ return {}; }) : null;
      return { status: res.status, data: data };
    } finally { clearTimeout(id); }
  }
  function post(path, body){
    return req(path, {
      method: "POST",
      headers: body !== undefined ? { "Content-Type": "application/json" } : undefined,
      body: body !== undefined ? JSON.stringify(body) : undefined,
      timeout: 4000,
    });
  }

  // ---------- estado ----------
  const state = {
    online: false,
    screen: "apps",
    pinned: [], running: [], installed: [],
    installedReady: false,
    obs: { connected: false, error: false, scenes: [], scene: null, recording: false, streaming: false },
    obsTimer: null,
  };

  const isRunning = name => state.running.some(a => a.name === name);

  // ---------- tap / hold ----------
  let suppressClickUntil = 0;
  function bindTap(el, fn){
    el.addEventListener("click", function(e){
      if (Date.now() < suppressClickUntil) return;
      if (e.target && e.target.closest && e.target.closest("[data-ignore]")) return;
      fn(el, e);
    });
  }
  function bindHold(el, fn){
    let timer = null, x = 0, y = 0;
    function clear(){ if (timer){ clearTimeout(timer); timer = null; } }
    el.addEventListener("pointerdown", function(e){
      clear();
      x = e.clientX; y = e.clientY;
      timer = setTimeout(function(){
        timer = null;
        if (!el.isConnected) return;
        suppressClickUntil = Date.now() + 700;
        fn(el);
      }, 550);
    });
    el.addEventListener("pointermove", function(e){
      if (timer && Math.hypot(e.clientX - x, e.clientY - y) > 10) clear();
    });
    el.addEventListener("pointerup", clear);
    el.addEventListener("pointercancel", clear);
    el.addEventListener("pointerleave", clear);
  }
  function makeBtn(el, label, fn){
    el.setAttribute("role", "button");
    el.setAttribute("aria-label", label);
    el.tabIndex = 0;
    el.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){
        e.preventDefault();
        fn(el, e);
      }
    });
    bindTap(el, fn);
  }

  // ---------- actions ----------
  async function activateApp(name){
    const run = state.running.find(a => a.name === name);
    const pid = run && Number.isInteger(run.pid) && run.pid > 0 ? run.pid : undefined;
    let r;
    try { r = await post("/api/apps/" + encodeURIComponent(name) + "/activate", { pid: pid }); }
    catch (e) { toast("Mac desconectado", "err"); return; }
    if (!r || r.data.ok !== true) toast("Não consegui abrir \"" + name + "\"", "err");
    else loadApps();
  }

  async function pinApp(name){
    let r;
    try { r = await post("/api/config/pinned", { app: name }); }
    catch (e) { toast("Mac desconectado", "err"); return; }
    if (r && r.data.ok === true){ toast("\"" + name + "\" adicionado aos favoritos"); loadApps(); }
    else toast("Falha ao fixar", "err");
  }

  async function unpinApp(name){
    let r;
    try { r = await req("/api/config/pinned/" + encodeURIComponent(name), { method: "DELETE", timeout: 4000 }); }
    catch (e) { toast("Mac desconectado", "err"); return; }
    if (r.data && r.data.ok === true){ toast("\"" + name + "\" removido"); loadApps(); }
    else toast("Falha ao remover", "err");
  }

  let lastFocus = null;
  function modalFocus(){
    const sheet = $("sheet");
    sheet.setAttribute("role", "dialog");
    sheet.setAttribute("aria-modal", "true");
    const f = sheet.querySelector("button");
    if (f) f.focus();
  }
  function modal(html, beforeMount){
    beforeMount = beforeMount || function(){};
    lastFocus = document.activeElement;
    $("sheet").innerHTML = html;
    beforeMount();
    $("scrim").classList.add("show");
    modalFocus();
  }
  function closeModal(){
    $("scrim").classList.remove("show");
    $("sheet").innerHTML = "";
    if (lastFocus && lastFocus.isConnected && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }
  $("scrim").addEventListener("pointerdown", function(e){ if (e.target === $("scrim")) closeModal(); });

  function favLong(el){
    // aceita elemento (hold) ou string (nome) — evita TypeError se alguém passar name direto
    const name = typeof el === "string" ? el : (el && el.dataset ? el.dataset.name : "");
    if (!name) return;
    modal(
      "<h3>Remover dos favoritos?</h3>" +
      "<div class=\"body\">\"" + name + "\" sai dos fixos. O app continua no Launchpad.</div>" +
      "<div class=\"btns\">" +
      "<button class=\"btn ghost\" data-sclose>Cancelar</button>" +
      "<button class=\"btn danger\" data-confirm>Remover</button>" +
      "</div>",
      function(){
        $("sheet").querySelector("[data-sclose]").addEventListener("click", closeModal);
        $("sheet").querySelector("[data-confirm]").addEventListener("click", function(){ closeModal(); unpinApp(name); });
      });
  }

  function tileLong(el){
    const name = el && el.dataset ? el.dataset.name : "";
    if (!name) return;
    if (state.pinned.indexOf(name) !== -1) favLong(name);
    else pinApp(name);
  }

  // ---------- rendering: launchpad ----------
  const launchpad = $("launchpad");
  const dots = $("dots");
  let pages = [];

  function buildTile(a, withIcon){
    const t = document.createElement("div");
    t.className = "atile";
    t.dataset.name = a.name;
    const glass = document.createElement("div");
    glass.className = "aglass";
    const img = document.createElement("img");
    img.className = "aicon";
    img.src = "/api/apps/" + encodeURIComponent(a.name) + "/icon";
    img.alt = "";
    img.decoding = "async";
    if (!withIcon) img.loading = "lazy";
    glass.appendChild(img);
    t.appendChild(glass);
    const nm = document.createElement("span");
    nm.className = "aname";
    nm.textContent = a.name;
    const st = document.createElement("span");
    st.className = "astatus";
    st.textContent = isRunning(a.name) ? "aberto" : "";
    if (isRunning(a.name)) st.classList.add("on");
    t.appendChild(nm);
    t.appendChild(st);
    makeBtn(t, a.name, function(el){ activateApp(el.dataset.name); });
    bindHold(t, tileLong);
    return t;
  }

  function replaceChildren(el, kids){
    while (el.firstChild) el.removeChild(el.firstChild);
    for (let i = 0; i < kids.length; i++) el.appendChild(kids[i]);
  }

  /** Marca página como hidratada — imagens já estão no DOM via buildTile. */
  function hydratePageIcons(pageIdx){
    const p = launchpad.children[pageIdx];
    if (p) p.dataset.hydrated = "1";
  }

  function hydrateAround(pageIdx){
    const n = launchpad.children.length;
    for (let i = Math.max(0, pageIdx - 1); i <= Math.min(n - 1, pageIdx + 1); i++){
      hydratePageIcons(i);
    }
  }

  function renderLaunchpad(keepPage){
    const prev = keepPage ? currentPage() : 0;
    // Tela 1 = favoritos na MESMA ordem do pinned (arrastada no Mac), não em ordem alfabética.
    const byName = new Map();
    for (let i = 0; i < state.installed.length; i++) byName.set(state.installed[i].name, state.installed[i]);
    const list = [];
    for (let i = 0; i < state.pinned.length; i++){
      const a = byName.get(state.pinned[i]);
      if (a) list.push(a);
    }
    if (!state.installedReady){
      launchpad.innerHTML = "";
      dots.innerHTML = "";
      return;
    }
    if (!list.length){
      launchpad.innerHTML = "<div class=\"page\" style=\"display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px\">nenhum app encontrado</div>";
      dots.innerHTML = "";
      pages = [];
      return;
    }
    const pz = pageSize();
    const chunked = [];
    for (let i = 0; i < list.length; i += pz) chunked.push(list.slice(i, i + pz));
    pages = chunked;
    // monta grid com monogramas (leve); ícones reais sob demanda
    const kids = chunked.map(function(chunk, idx){
      const p = document.createElement("div");
      p.className = "page";
      p.dataset.page = String(idx);
      const wantIcon = idx <= 1; // 1ª e 2ª página com ícone já no first paint
      for (let i = 0; i < chunk.length; i++) p.appendChild(buildTile(chunk[i], wantIcon));
      if (wantIcon) p.dataset.hydrated = "1";
      return p;
    });
    replaceChildren(launchpad, kids);
    renderDots();
    launchpad.scrollLeft = Math.min(prev, pages.length - 1) * launchpad.clientWidth;
    hydrateAround(Math.min(prev, pages.length - 1));
    layoutDockScale();
  }

  function renderDots(){
    if (pages.length <= 1){ dots.innerHTML = ""; return; }
    const kids = pages.map(function(_, i){
      const d = document.createElement("span");
      d.className = "d" + (i === currentPage() ? " on" : "");
      return d;
    });
    replaceChildren(dots, kids);
  }
  function currentPage(){
    if (!pages.length) return 0;
    const i = Math.round(launchpad.scrollLeft / Math.max(launchpad.clientWidth, 1));
    return Math.min(Math.max(i, 0), pages.length - 1);
  }
  let dotRaf = null;
  launchpad.addEventListener("scroll", function(){
    if (dotRaf) return;
    dotRaf = requestAnimationFrame(function(){
      dotRaf = null;
      if (!pages.length) return;
      const i = currentPage();
      const ds = dots.querySelectorAll(".d");
      for (let k = 0; k < ds.length; k++) ds[k].classList.toggle("on", k === i);
      hydrateAround(i);
    });
  });

  // ---- paisagem: dock mantém geometria retrato, só escala (GPU) e ícones giram ----
  function layoutDockScale(){
    if (!launchpad || !pages.length){
      if (launchpad && launchpad.style.transform) launchpad.style.transform = "";
      return;
    }
    let cleared = true;
    const land = typeof matchMedia === "function" && matchMedia("(orientation: landscape)").matches;
    if (land){
      const pg = launchpad.firstElementChild;
      const kids = pg && pg.children.length ? pg.children : null;
      if (kids){
        const first = kids[0], last = kids[kids.length - 1];
        const contentH = (last.offsetTop + last.offsetHeight) - first.offsetTop;
        const s = (launchpad.clientHeight || 1) / contentH;
        const cur = parseFloat(launchpad.style.transform) || 0;
        if (contentH > 0 && s < 1 && Math.abs(s - cur) > 0.01){
          launchpad.style.transform = "scale(" + s.toFixed(3) + ")";
          cleared = false;
        }
      }
    }
    if (cleared && launchpad.style.transform) launchpad.style.transform = "";
  }
  function landNeedsSecondary(){
    if (!matchMedia("(orientation: landscape)").matches) return false;
    try {
      const wo = window.orientation;
      if (typeof wo === "number" && wo !== 0) return wo > 0;
      if (screen.orientation){
        const ang = screen.orientation.angle;
        const typ = screen.orientation.type;
        if (ang === 90) return true;
        if (ang === 270 || ang === -90) return false;
        if (typeof typ === "string" && typ.indexOf("landscape-primary") === 0) return true;
        if (typeof typ === "string" && typ.indexOf("landscape-secondary") === 0) return false;
      }
      if (typeof window._lastGamma === "number" && Math.abs(window._lastGamma) > 30) return window._lastGamma < 0;
    } catch (err) {}
    return false;
  }
  function updateLandDir(){
    document.documentElement.classList.toggle("land-secondary", landNeedsSecondary());
  }
  try {
    window.addEventListener("deviceorientation", function(e){
      if (typeof e.gamma !== "number") return;
      window._lastGamma = e.gamma;
      if (Math.abs(e.gamma) > 30 && matchMedia("(orientation: landscape)").matches) updateLandDir();
    });
  } catch (err) {}
  let scaleTimer = null;
  function watchScale(){
    clearInterval(scaleTimer);
    scaleTimer = setInterval(function(){
      if (matchMedia("(orientation: landscape)").matches) layoutDockScale();
    }, 800);
  }
  try {
    matchMedia("(orientation: landscape)").addEventListener("change", function(){ layoutDockScale(); updateLandDir(); });
    window.addEventListener("resize", function(){ layoutDockScale(); updateLandDir(); });
    window.addEventListener("orientationchange", function(){ layoutDockScale(); updateLandDir(); });
    document.addEventListener("visibilitychange", function(){ layoutDockScale(); updateLandDir(); });
    window.addEventListener("pageshow", function(){ layoutDockScale(); updateLandDir(); });
  } catch (err) {}
  updateLandDir();
  watchScale();

  // ---------- rendering: tela 2 v01 — uma fileira Time Travel ----------
  function makeFavTile(name, isOpen){
    const f = document.createElement("div");
    f.className = "fav" + (isOpen ? " is-open" : "");
    f.dataset.name = name;
    if (isOpen) f.setAttribute("data-open", "1");
    const glass = document.createElement("div");
    glass.className = "aglass";
    const img = document.createElement("img");
    img.className = "aicon";
    img.src = "/api/apps/" + encodeURIComponent(name) + "/icon";
    img.alt = "";
    img.loading = "lazy";
    img.onerror = function(){
      if (img.remove) img.remove();
      while (glass.firstChild) glass.removeChild(glass.firstChild);
      glass.appendChild(giconEl(name));
    };
    glass.appendChild(img);
    f.appendChild(glass);
    makeBtn(f, name, function(el){ activateApp(el.dataset.name); });
    // long-press: pin se solto, unpin se fixo (ref: "to pin")
    bindHold(f, tileLong);
    return f;
  }

  /** Centro da viewport = ícone grande com glow amber; bordas encolhem com transparência e profundidade. */
  function layoutTimeTravel(scroll, row){
    if (!scroll || !row) return;
    const kids = row.children;
    if (!kids.length) return;
    const mid = scroll.scrollLeft + scroll.clientWidth * 0.52;
    const half = Math.max(scroll.clientWidth * 0.36, 1);
    for (let i = 0; i < kids.length; i++){
      const el = kids[i];
      const c = el.offsetLeft + el.offsetWidth / 2;
      let d = Math.abs(c - mid) / half;
      if (d > 1.8) d = 1.8;
      let s = 1.05 - d * 0.24;
      if (s < 0.72) s = 0.72;
      const t = "scale(" + s.toFixed(2) + ")";
      el.style.webkitTransform = t;
      el.style.transform = t;
      el.style.zIndex = String(Math.round(s * 100));
      el.style.opacity = String((0.30 + s * 0.70).toFixed(2));
      /* escada: offset vertical crescente da esquerda pra direita */
      const step = (i - (kids.length - 1) * 0.5) * 8;
      el.style.marginTop = step.toFixed(1) + "px";
      const aglass = el.querySelector(".aglass");
      if (aglass){
        if (s > 0.90){
          aglass.style.borderColor = "rgba(240, 135, 55, 0.55)";
          aglass.style.boxShadow = "inset 0 1.5px 0 rgba(255,255,255,.38), 0 0 24px rgba(210,95,30,.35), 0 8px 24px rgba(0,0,0,.50)";
        } else {
          aglass.style.borderColor = "rgba(255, 255, 255, 0.18)";
          aglass.style.boxShadow = "inset 0 1px 0 rgba(255,255,255,.20), 0 6px 14px rgba(0,0,0,.35)";
        }
      }
    }
  }

  /** Foca o grupo de apps ABERTOS (não o meio dos pinados — bug: abertos iam pra fora da tela). */
  function centerTimeTravel(scroll, row){
    if (!scroll || !row || !row.children.length) return;
    const open = row.querySelectorAll(".fav[data-open=\"1\"]");
    let el;
    if (open.length){
      el = open[Math.floor((open.length - 1) / 2)];
    } else {
      const n = row.children.length;
      el = row.children[n <= 2 ? 0 : Math.floor((n - 1) / 2)];
    }
    if (!el) return;
    const left = el.offsetLeft - (scroll.clientWidth - el.offsetWidth) / 2;
    scroll.scrollLeft = left < 0 ? 0 : left;
    layoutTimeTravel(scroll, row);
  }

  function bindTimeTravel(scroll, row){
    let raf = null;
    function tick(){
      raf = null;
      layoutTimeTravel(scroll, row);
    }
    function onScroll(){
      if (raf) return;
      raf = requestAnimationFrame(tick);
    }
    scroll.addEventListener("scroll", onScroll, false);
    centerTimeTravel(scroll, row);
    setTimeout(function(){ centerTimeTravel(scroll, row); }, 40);
    setTimeout(function(){ centerTimeTravel(scroll, row); }, 200);
  }

  function renderRecents(){
    const sc = document.createElement("div");
    sc.className = "recents";

    const head = document.createElement("div");
    head.className = "thead";
    const title = document.createElement("div");
    title.className = "ttitle";
    title.textContent = "App Time Travel";
    head.appendChild(title);
    sc.appendChild(head);

    const stage = document.createElement("div");
    stage.className = "rstage";

    const scroll = document.createElement("div");
    scroll.className = "favscroll";
    const row = document.createElement("div");
    row.className = "favrow";
    const added = {};
    // REGRA tela 2 (App Time Travel): SOMENTE apps ABERTOS no Mac (Foreground).
    // Favoritos pertencem à Tela 1 (launchpad) e não entram aqui — evita o mesmo
    // app duas vezes quando está aberto e também é favorito (ex.: Calendário/Calendar).
    state.running.forEach(function(a){
      if (a.type && a.type !== "Foreground") return;
      if (added[a.name]) return;
      added[a.name] = true;
      row.appendChild(makeFavTile(a.name, true));
    });

    if (row.children.length){
      scroll.appendChild(row);
      stage.appendChild(scroll);
      sc.appendChild(stage);
      const hint = document.createElement("div");
      hint.className = "thint";
      hint.innerHTML = "<span class=\"pic\" aria-hidden=\"true\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 17v5\"/><path d=\"M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z\"/></svg></span>Long press any app to pin";
      sc.appendChild(hint);
    } else {
      const e = document.createElement("div");
      e.className = "rempty";
      e.textContent = "Nada aberto ainda — abra um app no Mac para ele aparecer aqui";
      stage.appendChild(e);
      sc.appendChild(stage);
    }

    const obsApp = state.running.find(function(a){ return a.name === "OBS" || a.name === "OBS Studio"; });
    if (obsApp){
      const card = document.createElement("div");
      card.className = "robscard";
      const ic = document.createElement("span");
      ic.className = "ic";
      ic.textContent = "◈";
      card.appendChild(ic);
      const mid = document.createElement("div");
      mid.style.cssText = "flex:1 1 auto;min-width:0";
      const ot = document.createElement("div");
      ot.className = "ot";
      ot.textContent = "OBS";
      mid.appendChild(ot);
      const os = document.createElement("div");
      os.className = "os";
      os.textContent = state.obs.recording ? "gravando" : state.obs.streaming ? "ao vivo" : (state.obs.connected ? "conectado" : "offline");
      mid.appendChild(os);
      card.appendChild(mid);
      const arr = document.createElement("span");
      arr.className = "arr";
      arr.textContent = "›";
      card.appendChild(arr);
      makeBtn(card, "OBS, " + os.textContent, openDrawer);
      sc.appendChild(card);
    }

    replaceChildren($("screenRecents"), [sc]);
    if (row.children.length) bindTimeTravel(scroll, row);
  }

  // ---------- pin sheet ----------
  function openPinSheet(){
    const kids = [];
    const head = document.createElement("h3");
    head.textContent = "Fixar apps como favoritos";
    kids.push(head);
    const sub = document.createElement("div");
    sub.style.cssText = "margin-bottom:10px;color:var(--ink-3);font-size:12px";
    sub.textContent = state.installed.length + " apps instalados";
    kids.push(sub);
    state.installed.forEach(function(a){
      const pinned = state.pinned.indexOf(a.name) !== -1;
      const row = document.createElement("div");
      row.className = "srow";
      row.dataset.name = a.name;
      if (a.icon){
        const img = document.createElement("img");
        img.src = "/api/apps/" + encodeURIComponent(a.name) + "/icon";
        img.alt = "";
        img.onerror = function(){
          if (img.remove) img.remove();
          row.insertBefore(giconEl(a.name), row.firstChild);
        };
        row.appendChild(img);
      } else {
        row.appendChild(giconEl(a.name));
      }
      const nm = document.createElement("div");
      nm.style.cssText = "flex:1;min-width:0;font-size:14px;font-weight:600";
      nm.textContent = a.name;
      row.appendChild(nm);
      const pin = document.createElement("span");
      pin.className = "pin";
      pin.textContent = pinned ? "✓ fixado" : "+ fixar";
      row.appendChild(pin);
      makeBtn(row, a.name + (pinned ? ", fixado" : ", fixar"), function(el){
        if (state.pinned.indexOf(el.dataset.name) !== -1) unpinApp(el.dataset.name);
        else pinApp(el.dataset.name);
        openPinSheet();
      });
      kids.push(row);
    });
    const btns = document.createElement("div");
    btns.className = "btns";
    const btn = document.createElement("button");
    btn.className = "btn ghost";
    btn.textContent = "Fechar";
    btn.addEventListener("click", closeModal);
    btns.appendChild(btn);
    kids.push(btns);
    $("sheet").innerHTML = "";
    replaceChildren($("sheet"), kids);
    $("scrim").classList.add("show");
    lastFocus = document.activeElement;
    modalFocus();
  }

  // ---------- OBS (drawer) ----------
  function renderObs(){
    const panel = $("obspanel");
    const o = state.obs;
    if (!o.connected){
      const msg = o.error ? "OBS indisponível — verifique o WebSocket" : "OBS offline — abra o OBS para liberar as cenas";
      panel.innerHTML = "<div class=\"obsplaceholder\"><span class=\"ic\">◈</span>" + msg + "</div>";
      return;
    }
    let scenes = "";
    for (let i = 0; i < o.scenes.length; i++){
      const s = o.scenes[i];
      scenes += "<button class=\"scene" + (s === o.scene ? " active" : "") + "\" data-scene=\"" + s + "\">" + s + "</button>";
    }
    panel.innerHTML =
      "<div class=\"obstop\">" +
      "<span class=\"obstitle\">OBS Commander</span>" +
      "<span class=\"led on\"><span class=\"d\"></span>" + (o.streaming ? "AO VIVO" : "conectado") + "</span>" +
      "</div>" +
      "<div class=\"obsscene\">" + scenes + "</div>" +
      "<div class=\"obsctl\">" +
      "<button class=\"ctl" + (o.recording ? " on-record" : "") + "\" data-rec><span class=\"ic\">●</span><span>" + (o.recording ? "Parar" : "Gravar") + "</span></button>" +
      "<button class=\"ctl" + (o.streaming ? " on-stream" : "") + "\" data-str><span class=\"ic\">▲</span><span>" + (o.streaming ? "Parar" : "Live") + "</span></button>" +
      "<button class=\"ctl stop\" data-stop><span class=\"ic\">■</span><span>Encerrar</span></button>" +
      "</div>";
    const sc = panel.querySelectorAll(".scene");
    for (let i = 0; i < sc.length; i++){
      sc[i].addEventListener("click", function(){ doObs("scene", { scene: this.dataset.scene }); });
    }
    panel.querySelector("[data-rec]").addEventListener("click", function(){ doObs("record"); });
    panel.querySelector("[data-str]").addEventListener("click", function(){ doObs("stream"); });
    panel.querySelector("[data-stop]").addEventListener("click", confirmStopAll);
  }

  function confirmStopAll(){
    modal(
      "<h3>Encerrar transmissão?</h3>" +
      "<div class=\"body\">O OBS vai parar a gravação e a live.</div>" +
      "<div class=\"btns\">" +
      "<button class=\"btn ghost\" data-sclose>Cancelar</button>" +
      "<button class=\"btn danger\" data-confirm>Encerrar tudo</button>" +
      "</div>",
      function(){
        $("sheet").querySelector("[data-sclose]").addEventListener("click", closeModal);
        $("sheet").querySelector("[data-confirm]").addEventListener("click", function(){ closeModal(); doObs("stop-all"); });

  async function doObs(kind, body){
    let r;
    try { r = await post("/api/obs/" + encodeURIComponent(kind), body); }
    catch (e) { toast("Mac desconectado", "err"); return; }
    const d = r.data || {};
    if (d.ok === true) obsSyncSoon();
    else if (d.connected === false){ toast("OBS offline", "err"); obsSyncSoon(); }
    else toast("Comando OBS falhou", "err");
  }

  let syncT = null;
  function obsSyncSoon(){ clearTimeout(syncT); syncT = setTimeout(loadObs, 400); }

  async function loadObs(){
    try {
      const r = await req("/api/obs/state", { timeout: 4200 });
      const d = r.data || {};
      if (d.connected === true && d.state && Array.isArray(d.state.scenes)){
        state.obs = {
          connected: true, error: false,
          scenes: d.state.scenes, scene: d.state.scene,
          recording: !!d.state.recording, streaming: !!d.state.streaming,
        };
      } else if (d.connected === false){
        state.obs = { connected:false, error:false, scenes:[], scene:null, recording:false, streaming:false };
      } else {
        state.obs.connected = false; state.obs.error = true;
      }
    } catch (e) { state.obs.connected = false; state.obs.error = true; }
    renderObs();
    if ($("drawer").classList.contains("show")) state.obsTimer = setTimeout(loadObs, 4000);
    else state.obsTimer = null;
  }

  // ---------- reload automático quando o servidor sobe UI nova ----------
  // O kiosk fica horas aberto; sem isso, roda JS antigo (ex.: tela 2 quebrada)
  // mesmo com index.html novo no servidor. O servidor já manda "v" no WS e /api/apps.
  let uiVersionSeen = null;
  function maybeReloadForUi(v){
    if (!v) return;
    if (uiVersionSeen === null){ uiVersionSeen = v; return; }
    if (uiVersionSeen !== v){
      toast("Atualizando…", "");
      setTimeout(function(){ location.reload(); }, 600);
    }
  }

  // ---------- polling (pausa com aba/PWA em background) ----------
  function pageHidden(){
    return typeof document.hidden !== "undefined" && document.hidden;
  }
  let healthT = null, appsT = null;
  // polling com backoff adaptativo: online = taxa leve; falha/offline 2x atE 60s
  // (menos acordar de CPU/radio/bateria no J5; volta rapido quando reaparece)
  let healthBackoff = 15000, appsBackoff = 12000;
  const HEALTH_OK = 15000, APPS_OK = 12000, POLL_MAX = 60000, POLL_HIDDEN = 30000;

  function recentsKey(){
    let run = [];
    for (let i = 0; i < state.running.length; i++){
      const a = state.running[i];
      if (!a.type || a.type === "Foreground") run.push(a.name);
    }
    run.sort();
    // Tela 2 não depende mais de pinned (favoritos são da Tela 1) — chave só com running.
    return run.join("\u0001") +
      "|" + (state.running.some(a => a.name === "OBS" || a.name === "OBS Studio") ? 1 : 0);
  }
  let recentsKeyPrev = null;

  async function loadHealth(){
    if (healthT){ clearTimeout(healthT); healthT = null; }
    if (pageHidden()){ healthT = setTimeout(loadHealth, POLL_HIDDEN); return; }
    const prev = state.online;
    let ok = false;
    try {
      const r = await req("/health", { timeout: 2200 });
      ok = (r.status === 200) && r.data && r.data.ok === true;
    } catch (e) { ok = false; }
    state.online = ok;
    if (prev && !ok) toast("Mac desconectado", "err");
    if (!prev && ok) toast("Mac conectado");
    healthBackoff = ok ? HEALTH_OK : Math.min(healthBackoff * 2, POLL_MAX);
    healthT = setTimeout(loadHealth, healthBackoff);
  }

  let pinnedSig = "";
  function applyAppsPayload(pinned, running){
    if (!Array.isArray(pinned) || !Array.isArray(running)) return false;
    const nextSig = pinned.join("\u0000");
    const pinnedChanged = nextSig !== pinnedSig;
    pinnedSig = nextSig;
    state.pinned = pinned;
    state.running = running;
    if (pinnedChanged) renderLaunchpad(true); // Tela 1 = favoritos; refaz quando pinned muda
    const key = recentsKey();
    if (recentsKeyPrev === null || key !== recentsKeyPrev){
      recentsKeyPrev = key;
      renderRecents();
    }
    updateStatuses();
    return true;
  }

  // WebSocket: pin no Mac → device em <1s (sem esperar poll de 12s)
  let statusWs = null, wsRetry = 2000, wsTimer = null;
  function connectStatusWs(){
    if (!("WebSocket" in window)) return;
    if (statusWs && (statusWs.readyState === 0 || statusWs.readyState === 1)) return;
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    let ws;
    try { ws = new WebSocket(proto + "//" + location.host + "/ws"); }
    catch (e) { scheduleWsReconnect(); return; }
    statusWs = ws;
    ws.onopen = function(){ wsRetry = 2000; };
    ws.onmessage = function(ev){
      let m = null;
      try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!m) return;
      if (m.type === "online"){
        state.online = !!m.online;
        maybeReloadForUi(m.v);
      } else if (m.type === "apps"){
        state.online = true;
        maybeReloadForUi(m.v);
        applyAppsPayload(m.pinned, m.running);
      }
    };
    ws.onclose = function(){
      if (statusWs === ws) statusWs = null;
      scheduleWsReconnect();
    };
    ws.onerror = function(){ try { ws.close(); } catch (e) {} };
  }
  function scheduleWsReconnect(){
    if (wsTimer) return;
    wsTimer = setTimeout(function(){
      wsTimer = null;
      if (!pageHidden()) connectStatusWs();
    }, wsRetry);
    wsRetry = Math.min(wsRetry * 2, 30000);
  }

  async function loadApps(){
    if (appsT){ clearTimeout(appsT); appsT = null; }
    if (pageHidden()){ appsT = setTimeout(loadApps, POLL_HIDDEN); return; }
    // se WS está vivo, só dá ping leve a cada ciclo longo; senão poll HTTP
    if (statusWs && statusWs.readyState === 1){
      try { statusWs.send(JSON.stringify({ type: "ping" })); } catch (e) {}
      appsBackoff = APPS_OK;
      appsT = setTimeout(loadApps, appsBackoff);
      return;
    }
    let ok = false;
    try {
      const r = await req("/api/apps", { timeout: 4200 });
      if (r.status === 200 && Array.isArray(r.data && r.data.pinned) && Array.isArray(r.data && r.data.running)){
        ok = true;
        maybeReloadForUi(r.data.v);
        applyAppsPayload(r.data.pinned, r.data.running);
      }
    } catch (e) { /* offline: keep last view */ }
    appsBackoff = ok ? APPS_OK : Math.min(appsBackoff * 2, POLL_MAX);
    appsT = setTimeout(loadApps, appsBackoff);
    if (!ok) connectStatusWs();
  }
  if (typeof document.addEventListener === "function"){
    document.addEventListener("visibilitychange", function(){
      if (!pageHidden()){ loadHealth(); connectStatusWs(); loadApps(); }
    });
  }

  function updateStatuses(){
    const running = new Set();
    for (let i = 0; i < state.running.length; i++) running.add(state.running[i].name);
    const at = document.querySelectorAll(".atile");
    for (let i = 0; i < at.length; i++){
      const st = at[i].querySelector(".astatus");
      const on = running.has(at[i].dataset.name);
      if (on){ st.textContent = "aberto"; st.classList.add("on"); }
      else { st.textContent = ""; st.classList.remove("on"); }
    }
  }

  // tela 2 time travel: sem rdot/labels — rebuild já cobre mudanças estruturais
  function updateRecentsDots(){ /* no-op: visual limpo como a ref */ }

  async function loadInstalled(){
    try {
      const r = await req("/api/apps/installed", { timeout: 6000 });
      if (r.status === 200 && r.data && r.data.ok === true && Array.isArray(r.data.apps)){
        state.installed = r.data.apps;
        state.installedReady = true;
        renderLaunchpad();
      }
    } catch (e) { setTimeout(loadInstalled, 8000); }
  }

  // ---------- header ----------
  function openDrawer(){
    $("drawer").classList.add("show");
    loadObs();
  }
  $("drawerClose").addEventListener("click", function(){
    $("drawer").classList.remove("show");
    if (state.obsTimer){ clearTimeout(state.obsTimer); state.obsTimer = null; }
  });

  // ---------- telas (swipe vertical) ----------
  function renderVDots(){
    const v = $("vdots");
    if (v.firstChild) return; // já renderizado
    for (let i = 0; i < 2; i++){
      const d = document.createElement("span");
      d.className = "d" + (i === 0 ? " on" : "");
      v.appendChild(d);
    }
  }

  function syncVDots(){
    const ds = $("vdots").querySelectorAll(".d");
    if (ds[0]) ds[0].classList.toggle("on", state.screen === "apps");
    if (ds[1]) ds[1].classList.toggle("on", state.screen === "recents");
  }

  function goScreen(name){
    if (name === state.screen) return;
    state.screen = name;
    document.body.classList.toggle("is-recents", name === "recents");
    syncVDots();
    if (name === "recents"){
      const scroll = document.querySelector("#screenRecents .favscroll");
      const row = document.querySelector("#screenRecents .favrow");
      if (scroll && row) centerTimeTravel(scroll, row);
    }
  }

    const screensEl = $("screens");
  if (screensEl){
    const screenApps = $("screenApps");
    const screenRecents = $("screenRecents");
    const DRAG = 8;
    const AXIS_RATIO = 1.1;
    const VEL_INST = 0.3;
    const VEL_AVG = 0.45;
    const FLICK_MIN = 16;
    const RUBBER = 28;
    const COOLDOWN_MS = 160;
    let sx = 0, sy = 0, t0 = 0, moving = false, pid = null;
    let coolUntil = 0;
    let wheelDelta = 0;
    let wheelT = null;
    let settleT = null;
    let settling = false;
    let lastY = 0, lastT = 0, instVel = 0;

    function h(){ return Math.max(screensEl.offsetHeight, 1); }
    function commitPx(){ return Math.max(40, Math.round(h() * 0.08)); }
    function wheelCommitPx(){ return Math.max(70, Math.round(h() * 0.14)); }
    function activeEl(){ return state.screen === "apps" ? screenApps : screenRecents; }
    function rubberDy(dy){
      if (dy > 0) return Math.min(dy, RUBBER);
      if (dy < -h()) return -h() - RUBBER;
      return dy;
    }
    function applyDrag(dy){
      const d = rubberDy(dy);
      if (state.screen === "apps"){
        if (screenApps) screenApps.style.transform = "translateY(" + d + "px)";
        if (screenRecents) screenRecents.style.transform = "translateY(" + (d + h()) + "px)";
      } else {
        if (screenRecents) screenRecents.style.transform = "translateY(" + d + "px)";
        if (screenApps) screenApps.style.transform = "translateY(" + (d - h()) + "px)";
      }
    }
    function clearDrag(){
      if (screenApps){ screenApps.style.transform = ""; screenApps.style.transition = ""; }
      if (screenRecents){ screenRecents.style.transform = ""; screenRecents.style.transition = ""; }
    }
    function setLayer(on){
      try {
        const g = on ? "transform" : "";
        for (const el of [screenApps, screenRecents]){ if (el) el.style.willChange = g; }
      } catch (err) {}
    }
    let dragRaf = null, dragDy = null;
    function dragTo(dy){
      dragDy = dy;
      if (!dragRaf) dragRaf = requestAnimationFrame(function(){
        dragRaf = null;
        applyDrag(dragDy);
      });
    }
    function dragFlush(){
      if (dragRaf){ cancelAnimationFrame(dragRaf); dragRaf = null; }
      if (dragDy != null){ applyDrag(dragDy); dragDy = null; }
    }
    // ---- pager horizontal do launchpad (flick/25% troca página) ----
    let hGest = false, hStart = 0, hVel = 0, hLastX = 0;
    let hRaf = null, hDx = 0, hSnapT = null;
    const HV_FLICK = 0.45;
    const HPAGE_RATIO = 0.25;
    function hTo(dx){
      hDx = dx;
      if (!hRaf) hRaf = requestAnimationFrame(function(){
        hRaf = null;
        if (launchpad) launchpad.scrollLeft = hStart - hDx;
      });
    }
    function hFlush(){
      if (hRaf){ cancelAnimationFrame(hRaf); hRaf = null; }
      if (launchpad) launchpad.scrollLeft = hStart - hDx;
    }
    function hDecide(dx){
      const pw = Math.max(launchpad.clientWidth, 1);
      if (hVel <= -HV_FLICK || dx <= -pw * HPAGE_RATIO) return "next";
      if (hVel >= HV_FLICK || dx >= pw * HPAGE_RATIO) return "prev";
      return null;
    }
    function hCommit(dir){
      if (!launchpad || !pages.length){
        if (launchpad) launchpad.style.scrollSnapType = "";
        return;
      }
      const pw = Math.max(launchpad.clientWidth, 1);
      const i = currentPage();
      let t = i;
      if (dir === "prev") t = Math.max(i - 1, 0);
      else if (dir === "next") t = Math.min(i + 1, pages.length - 1);
      try { launchpad.scrollTo({ left: t * pw, behavior: "smooth" }); } catch (err) {}
      clearTimeout(hSnapT);
      hSnapT = setTimeout(function(){ launchpad.style.scrollSnapType = ""; }, 500);
      coolUntil = Date.now() + COOLDOWN_MS;
    }

    function finishSettle(nextName){
      settling = false;
      setLayer(false);
      clearDrag();
      if (settleT){ clearTimeout(settleT); settleT = null; }
      screensEl.removeEventListener("transitionend", onSettleEnd);
      if (nextName) goScreen(nextName);
      coolUntil = Date.now() + COOLDOWN_MS;
    }
    function onSettleEnd(e){
      if (e.propertyName && e.propertyName !== "transform") return;
      const next = screensEl._nextScreen || null;
      screensEl._nextScreen = null;
      finishSettle(next);
    }
    function settleTo(nextName){
      settling = true;
      if (settleT){ clearTimeout(settleT); settleT = null; }
      screensEl.removeEventListener("transitionend", onSettleEnd);
      void screensEl.offsetHeight;
      // Toggle opacity FIRST so the incoming screen is visible during the slide
      goScreen(nextName);
      // Animate both screens to final positions via CSS transition
      const ease = "transform .18s cubic-bezier(.22,.61,.36,1)";
      if (nextName === "recents"){
        if (screenApps) screenApps.style.transition = ease;
        if (screenRecents) screenRecents.style.transition = ease;
        applyDrag(-h());
      } else {
        if (screenApps) screenApps.style.transition = ease;
        if (screenRecents) screenRecents.style.transition = ease;
        applyDrag(h());
      }
      screensEl._nextScreen = nextName || null;
      screensEl.addEventListener("transitionend", onSettleEnd);
      settleT = setTimeout(function(){
        const n = screensEl._nextScreen || null;
        screensEl._nextScreen = null;
        finishSettle(n);
      }, 240);
    }
    function settleAndCommit(dir){
      if (Date.now() < coolUntil && dir){
        clearDrag();
        return;
      }
      if (dir === "up" && state.screen === "apps") settleTo("recents");
      else if (dir === "down" && state.screen === "recents") settleTo("apps");
      else clearDrag();
    }
    function releasePointer(){
      if (pid != null && screensEl.releasePointerCapture){
        try { screensEl.releasePointerCapture(pid); } catch (err) {}
      }
      pid = null;
    }
    function decideDir(dy, dt){
      const need = commitPx();
      const avg = dt > 0 ? Math.abs(dy) / dt : 0;
      const iv = Math.abs(instVel);
      const flick =
        (iv >= VEL_INST && Math.abs(dy) >= FLICK_MIN) ||
        (avg >= VEL_AVG && Math.abs(dy) >= FLICK_MIN);
      if (state.screen === "apps"){
        if (dy <= -need || (flick && dy < 0)) return "up";
      } else {
        if (dy >= need || (flick && dy > 0)) return "down";
      }
      return null;
    }

    screensEl.addEventListener("pointerdown", function(e){
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (settling){
        if (settleT){ clearTimeout(settleT); settleT = null; }
        screensEl.removeEventListener("transitionend", onSettleEnd);
        screensEl._nextScreen = null;
        settling = false;
      }
      setLayer(true);
      sx = e.clientX; sy = e.clientY; t0 = e.timeStamp;
      lastY = e.clientY; lastT = e.timeStamp; instVel = 0;
      hStart = launchpad ? launchpad.scrollLeft : 0;
      hLastX = e.clientX; hVel = 0; hGest = false;
      moving = false;
      pid = e.pointerId;
      if (screensEl.setPointerCapture){
        try { screensEl.setPointerCapture(pid); } catch (err) {}
      }
    });

    screensEl.addEventListener("pointermove", function(e){
      if (pid == null || e.pointerId !== pid) return;
      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      const dtt = e.timeStamp - lastT;
      if (dtt > 0){
        const v = (e.clientY - lastY) / dtt;
        instVel = instVel * 0.35 + v * 0.65;
        const hv = (e.clientX - hLastX) / dtt;
        hVel = hVel * 0.35 + hv * 0.65;
      }
      lastY = e.clientY;
      hLastX = e.clientX;
      lastT = e.timeStamp;
      if (!moving){
        if (Math.abs(dy) < DRAG && Math.abs(dx) < DRAG) return;
        if (Date.now() < coolUntil) return;
        if (Math.abs(dx) > Math.abs(dy) * AXIS_RATIO){
          if (!(e.target && e.target.closest && e.target.closest(".launchpad"))) return;
          if (launchpad) launchpad.style.scrollSnapType = "none";
          hGest = true; moving = true;
        } else {
          hGest = false; moving = true;
        }
      }
      e.preventDefault();
      if (hGest) hTo(dx);
      else dragTo(dy);
    }, { passive: false });

    function endPointer(e){
      if (pid != null && e && e.pointerId !== pid) return;
      dragFlush();
      hFlush();
      const ey = e && typeof e.clientY === "number" ? e.clientY : lastY;
      const et = e && e.timeStamp ? e.timeStamp : lastT;
      const dy = ey - sy;
      const dx = (e && typeof e.clientX === "number" ? e.clientX : sx) - sx;
      const dt = Math.max(et - t0, 1);
      if (et > lastT){
        const v = (ey - lastY) / (et - lastT);
        instVel = instVel * 0.2 + v * 0.8;
        const hvv = (e && typeof e.clientX === "number" ? e.clientX : hLastX) - hLastX;
        if (et - lastT > 0) hVel = hVel * 0.2 + (hvv / (et - lastT)) * 0.8;
      }
      if (!moving){
        const vertical = Math.abs(dy) >= Math.abs(dx) * AXIS_RATIO;
        let done = false;
        if (vertical){
          const dirQuick = decideDir(dy, dt);
          if (dirQuick){
            suppressClickUntil = Date.now() + 320;
            settleAndCommit(dirQuick);
            done = true;
          }
        } else if (e && e.target && e.target.closest && e.target.closest(".launchpad")
                   && Math.abs(dx) >= 14 && Math.abs(hVel) >= HV_FLICK){
          suppressClickUntil = Date.now() + 320;
          hCommit(hVel < 0 ? "next" : "prev");
          done = true;
        }
        if (!done) setLayer(false);
        releasePointer();
        return;
      }
      moving = false;
      suppressClickUntil = Date.now() + 320;
      if (hGest) hCommit(hDecide(dx));
      else settleAndCommit(decideDir(dy, dt));
      releasePointer();
    }

    screensEl.addEventListener("pointerup", endPointer);
    screensEl.addEventListener("pointercancel", function(e){
      if (pid != null && e.pointerId !== pid) return;
      dragFlush();
      hFlush();
      if (hGest){
        moving = false;
        hCommit(hDecide(hLastX - sx));
        releasePointer();
        return;
      }
      if (moving || Math.abs(instVel) >= VEL_INST){
        moving = false;
        const dy = lastY - sy;
        settleAndCommit(decideDir(dy, Math.max(lastT - t0, 1)));
      } else {
        setLayer(false);
      }
      releasePointer();
    });

    screensEl.addEventListener("wheel", function(e){
      if (e.ctrlKey) return;
      if (settling) return;
      const adx = Math.abs(e.deltaX), ady = Math.abs(e.deltaY);
      if (adx >= ady * AXIS_RATIO) return;
      if (Date.now() < coolUntil){ e.preventDefault(); return; }
      e.preventDefault();
      let d = e.deltaY;
      if (e.deltaMode === 1) d *= 18;
      else if (e.deltaMode === 2) d *= h();
      d *= 0.9;
      d = -d;
      setLayer(true);
      if (!wheelT) wheelDelta = 0;
      wheelDelta += d;
      const maxVis = h() * 0.5;
      if (wheelDelta > maxVis) wheelDelta = maxVis;
      if (wheelDelta < -maxVis) wheelDelta = -maxVis;
      applyDrag(wheelDelta);
      clearTimeout(wheelT);
      wheelT = setTimeout(function(){
        wheelT = null;
        const dd = wheelDelta;
        wheelDelta = 0;
        const need = wheelCommitPx();
        let dir = null;
        if (state.screen === "apps" && dd <= -need) dir = "up";
        else if (state.screen === "recents" && dd >= need) dir = "down";
        settleAndCommit(dir);
      }, 140);
    }, { passive: false });

    const vdots = $("vdots");
    if (vdots){
      vdots.addEventListener("click", function(e){
        if (settling) return;
        const ds = vdots.querySelectorAll(".d");
        let i = -1;
        for (let k = 0; k < ds.length; k++){
          if (e.target === ds[k]){ i = k; break; }
        }
        if (i < 0){
          const r = vdots.getBoundingClientRect();
          i = (e.clientY - r.top) < r.height / 2 ? 0 : 1;
        }
        if (i === 0 && state.screen !== "apps") settleAndCommit("down");
        else if (i === 1 && state.screen !== "recents") settleAndCommit("up");
      });
    }

    function reAnchor(){
      if (!moving && !settling){
        clearDrag();
        coolUntil = Date.now() + COOLDOWN_MS;
      }
    }
    window.addEventListener("resize", function(){
      checkOrientation();
      reAnchor();
    });
    if (window.visualViewport){
      window.visualViewport.addEventListener("resize", reAnchor);
      window.visualViewport.addEventListener("scroll", reAnchor);
    }
  }

  renderVDots();

  // orientation change
  checkOrientation();
  window.addEventListener("resize", function(){
    checkOrientation();
  });

  loadHealth();
  connectStatusWs();
  loadApps();
  loadInstalled();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js").catch(function() {});
  }
})();</script>
