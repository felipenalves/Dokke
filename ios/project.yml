name: Dokke
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Dokke:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Dokke
    info:
      path: Dokke/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j5dock.app
        PRODUCT_NAME: Dokke
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
